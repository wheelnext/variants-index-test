---
exclude: >-
  ^docs/|/migrations/|devcontainer.json|.*.html|.*.css|.*.js|.*.svg|.*.dist

default_language_version:
  python: python3.14

# ========================================================================= #
#                                 FORMATING                                 #
# ========================================================================= #

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  # Markdown formatting
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.5
    hooks:
      - id: prettier
        name: prettier markdown
        types_or: [markdown, json, yaml, toml]
        args: [--prose-wrap=always]

  # Run the Ruff linter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^tests/artifacts/
      # Formatter
      - id: ruff-format
        exclude: ^tests/artifacts/

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.4.0 # check for the latest version
    hooks:
      - id: autoflake
        args:
          [
            "--in-place",
            "--remove-all-unused-imports",
            "--remove-unused-variables",
            "--expand-star-imports",
          ]
        additional_dependencies: ["autoflake"]

  # -------------------------
  # CI formatting
  # -------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # Accept GitHub Actions `on` and capitalized YAML booleans.
        args:
          - --config-data
          - |
            extends: default
            rules:
              truthy:
                allowed-values: ['true', 'false', 'True', 'False', 'on']

  - repo: https://github.com/shenxianpeng/hadolint-pre-commit
    # This wrapper bundles Hadolint 2.15.1 in prek's isolated environment.
    rev: v2.15.1.2
    hooks:
      - id: hadolint
        # Allow latest image tags and distro-managed APT package versions.
        args:
          - --ignore
          - DL3007 # Allow `latest` Docker image tags.
          - --ignore
          - DL3008 # Allow APT packages without explicit version pins.

  # ========================================================================= #
  #                           DEPENDENCY MANAGEMENT                           #
  # ========================================================================= #

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.10
    hooks:
      - id: uv-lock
        args: ["--check"]

  # ========================================================================= #
  #                                 SECURITY                                  #
  # ========================================================================= #

  - repo: https://github.com/pycqa/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-iii", "-ll"]

  - repo: https://github.com/pysentry/pysentry-pre-commit
    rev: v0.5.0
    hooks:
      - id: pysentry
        args:
          [
            "--format=human",
            "--fail-on=medium",
            "--forbid-quarantined",
            "--sources=pypa,osv,pypi",
          ]
